<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EC">
<meta name="color-scheme" content="light dark">
<title>農墟廚房 Market Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* ---------- Warm Paper Kitchen: tokens ---------- */
:root {
  --bg: #F7F4EC;
  --surface: #FFFDF8;
  --surface-2: #EFEADF;
  --fg: #2B2A26;
  --muted: #6B665C;
  --line: #E3DDD0;
  --accent: #B4562F;          /* clay: button fill only (4.43:1 on --bg, so never used as text) */
  --on-accent: #FFFFFF;
  --accent-text: #A34C2A;     /* links, Source lines, clay-coloured text */
  --accent-tint: #F3E2D7;     /* active tab pill */
  --leaf: #3E6B4C;            /* selected chips, organic tags, success */
  --on-leaf: #FFFFFF;
  --focus: #A34C2A;
  --shadow: 0 -2px 12px rgb(43 42 38 / .08);
  --nav-h: 72px;
  --font: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --card-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", "PingFang HK", system-ui, sans-serif;
  /* type scale 28 / 22 / 18 / 17 / 14 px (root = 17 px) */
  --fs-1: 1.6471rem; --fs-2: 1.2941rem; --fs-3: 1.0588rem; --fs-4: 1rem; --fs-5: .8235rem;
  /* legacy names used by the VegCard block */
  --text: var(--fg); --border: var(--line);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1E1B; --surface: #2A2925; --surface-2: #34322D; --fg: #ECE8DF; --muted: #A8A398; --line: #3A3833;
    --accent: #E08A63; --on-accent: #1F1E1B; --accent-text: #E08A63; --accent-tint: #3E2E26;
    --leaf: #8DBF98; --on-leaf: #1F1E1B; --focus: #E08A63; --shadow: 0 -2px 14px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1E1B; --surface: #2A2925; --surface-2: #34322D; --fg: #ECE8DF; --muted: #A8A398; --line: #3A3833;
  --accent: #E08A63; --on-accent: #1F1E1B; --accent-text: #E08A63; --accent-tint: #3E2E26;
  --leaf: #8DBF98; --on-leaf: #1F1E1B; --focus: #E08A63; --shadow: 0 -2px 14px rgb(0 0 0 / .35);
  color-scheme: dark;
}

/* ---------- Base ---------- */
html { font-size: 106.25%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--fs-4); line-height: 1.7;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--accent-text); text-underline-offset: 3px; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 700; color: var(--fg); }
h2 { font-size: var(--fs-1); line-height: 1.35; margin: 0 0 12px; }
h2:focus { outline: none; }
h3 { font-size: var(--fs-3); line-height: 1.45; margin: 24px 0 8px; font-weight: 600; }
h4 { font-size: var(--fs-4); line-height: 1.5; margin: 16px 0 4px; font-weight: 600; }
.num, dl.kv dd, .counter, .meta, #h-coll { font-variant-numeric: tabular-nums; }
.counter, dl.kv dd { font-family: var(--mono); }

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 20px 10px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font-size: var(--fs-2); line-height: 1.3; }
.brand p { margin: 0; font-size: var(--fs-5); color: var(--muted); line-height: 1.4; }
.tbtn {
  min-width: 56px; min-height: 48px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--fg); font-weight: 700; font-size: var(--fs-4); cursor: pointer;
}
.draft {
  margin: 0; padding: 8px 20px; font-size: var(--fs-5); line-height: 1.6;
  background: var(--surface-2); color: var(--muted); border-bottom: 1px solid var(--line);
}
.draft strong { color: var(--fg); font-weight: 700; }

/* ---------- Layout ---------- */
main { max-width: 560px; margin: 0 auto; padding: 24px 20px 0; }
section[hidden] { display: none; }
section > * + h3, .panel + h3 { margin-top: 32px; }
.intro { margin: 0 0 20px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin: 20px 0; }
.panel h3:first-child { margin-top: 0; }
.tbc { color: var(--muted); }

/* Chips: ivory pills, leaf green with a check when selected */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 8px; padding: 0; list-style: none; }
.chip {
  min-height: 48px; padding: 8px 18px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font-weight: 500; font-size: var(--fs-4); line-height: 1.3;
  transition: background-color 180ms ease-out, color 180ms ease-out, border-color 180ms ease-out;
}
.chip[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); border-color: var(--leaf); font-weight: 700; }
.chip[aria-pressed="true"]::before { content: "✓\00a0"; }

/* Buttons: one full-width clay primary per screen; everything else quiet */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 12px 22px; border-radius: 14px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
  font-weight: 700; font-size: var(--fs-4); line-height: 1.3; text-decoration: none; text-align: center;
  transition: transform 180ms ease-out, filter 180ms ease-out;
}
.btn:active { transform: translateY(1px); filter: brightness(.96); }
.btn.secondary { background: var(--surface); color: var(--fg); border-color: var(--line); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .6; cursor: not-allowed; }
.primary-wide { width: 100%; }
.row { display: flex; flex-direction: column; gap: 12px; }

/* ---------- Bottom tab bar ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: var(--shadow); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.nav a {
  flex: 1 1 0; max-width: 180px; min-width: 0; min-height: 60px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: var(--muted); text-decoration: none;
  font-size: var(--fs-5); line-height: 1.25; text-align: center; font-weight: 700;
  -webkit-tap-highlight-color: transparent;
}
.nav a .ico { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background-color 180ms ease-out; }
.nav a .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav a[aria-current="page"] { color: var(--accent-text); }
.nav a[aria-current="page"] .ico { background: var(--accent-tint); }
.nav a span:last-child { overflow-wrap: anywhere; }

/* ---------- VegCard (ported from the VegCard iOS app; 310x440 pt) ---------- */
.stage { display: flex; flex-direction: column; align-items: center; margin: 8px 0 4px; }
.vc-persp { perspective: 900px; }
.vc {
  --cw: var(--card-w, min(310px, calc(100vw - 40px)));
  --u: calc(var(--cw) / 310);
  width: var(--cw); height: calc(var(--cw) * 440 / 310);
  position: relative; cursor: pointer;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  touch-action: pan-y; -webkit-tap-highlight-color: transparent;
}
.vc * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.vc:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; border-radius: calc(18 * var(--u)); }
.vc-spin { width: 100%; height: 100%; transform-style: preserve-3d; }
.vc-spin.spinning { animation: vcSpin .7s cubic-bezier(.34, 1.36, .64, 1); }
@keyframes vcSpin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
.vc-flip {
  width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.34, 1.3, .64, 1);
}
.vc.flipped .vc-flip { transform: rotateY(180deg); }
.vc-face {
  position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden;
  font-family: var(--card-font); color: #000; line-height: 1.2;
}
.vc-back-face { transform: rotateY(180deg); }
.vc-shake { animation: vcShake .25s linear 2; }
@keyframes vcShake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(calc(-3 * var(--u)), calc(2 * var(--u))); } 75% { transform: translate(calc(3 * var(--u)), calc(-2 * var(--u))); } }

/* Standard front */
.std {
  height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden;
  border: calc(6 * var(--u)) solid transparent; border-radius: calc(18 * var(--u));
  background:
    linear-gradient(#fff, var(--t-bg)) padding-box,
    linear-gradient(135deg, var(--t-border), var(--t-primary), var(--t-border)) border-box;
  box-shadow: 0 calc(6 * var(--u)) calc(14 * var(--u)) rgb(var(--t-primary-rgb) / .4);
}
.std::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  border: calc(1.5 * var(--u)) solid rgb(255 255 255 / .8); border-radius: calc(12 * var(--u));
}
.vc-head {
  display: flex; align-items: center; gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(8 * var(--u)) calc(6 * var(--u));
}
.vc-head .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vc-stage { font-size: calc(9 * var(--u)); font-weight: 900; color: rgb(var(--t-primary-rgb) / .8); margin-bottom: calc(-2 * var(--u)); }
.vc-name { font-size: calc(22 * var(--u)); font-weight: 900; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vc-eco { display: flex; align-items: center; gap: calc(3 * var(--u)); }
.vc-eco b { font-size: calc(11 * var(--u)); font-weight: 900; color: var(--t-primary); }
.vc-eco strong { font-size: calc(22 * var(--u)); font-weight: 800; color: #000; }
.vc-badge {
  width: calc(24 * var(--u)); height: calc(24 * var(--u)); border-radius: 50%;
  background: var(--t-primary); display: grid; place-items: center;
  box-shadow: 0 calc(1 * var(--u)) calc(3 * var(--u)) rgb(var(--t-primary-rgb) / .5);
}
.vc-badge svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); fill: #fff; }
.vc-art {
  height: calc(var(--cw) * 440 / 310 * .49); margin: 0 calc(6 * var(--u)); flex: none;
  position: relative; overflow: hidden; border-radius: calc(6 * var(--u));
  background:
    radial-gradient(circle at calc(2 * var(--u)) calc(2 * var(--u)), rgb(var(--t-primary-rgb) / .05) calc(2 * var(--u)), transparent calc(2.2 * var(--u))) 0 0 / calc(20 * var(--u)) calc(20 * var(--u)),
    linear-gradient(135deg, rgb(var(--t-secondary-rgb) / .8), rgb(var(--t-primary-rgb) / .2)),
    #fff;
  box-shadow: inset 0 0 0 calc(2 * var(--u)) rgb(var(--t-primary-rgb) / .5), inset 0 calc(3 * var(--u)) calc(3 * var(--u)) rgb(0 0 0 / .1);
}
.vc-art .subj {
  position: absolute; inset: calc(4 * var(--u)); background-position: center; background-repeat: no-repeat; background-size: contain;
  filter: drop-shadow(0 calc(2 * var(--u)) calc(4 * var(--u)) rgb(0 0 0 / .2));
}
.vc-art .subj svg { width: 100%; height: 100%; fill: var(--t-primary); opacity: .85; }
.vc-art::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay;
  background: linear-gradient(135deg, rgb(255 255 255 / 0), rgb(255 255 255 / .35), rgb(255 255 255 / 0));
}
.vc-moves { padding: 0 calc(8 * var(--u)); display: flex; flex-direction: column; gap: calc(10 * var(--u)); }
.vc-div { height: 1px; background: rgb(var(--t-primary-rgb) / .5); flex: none; }
.vc-div.soft { background: rgb(var(--t-primary-rgb) / .3); }
.vc-moves .vc-div:first-child { margin-top: calc(6 * var(--u)); }
.vc-move { display: flex; align-items: flex-start; gap: calc(8 * var(--u)); }
.vc-cost { width: calc(30 * var(--u)); display: flex; gap: calc(2 * var(--u)); justify-content: center; flex: none; padding-top: calc(1 * var(--u)); }
.vc-cost i { width: calc(14 * var(--u)); height: calc(14 * var(--u)); border-radius: 50%; background: var(--t-primary); box-shadow: 0 0 calc(1 * var(--u)) rgb(0 0 0 / .3); }
.vc-cost i + i { background: rgb(var(--t-primary-rgb) / .6); box-shadow: none; }
.vc-mt { flex: 1; min-width: 0; }
.vc-mt b { display: block; font-size: calc(13 * var(--u)); font-weight: 700; color: #000; }
.vc-mt span {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: calc(9.5 * var(--u)); color: rgb(0 0 0 / .75); line-height: 1.25;
}
.vc-dmg { font-size: calc(18 * var(--u)); font-weight: 900; color: #000; }
.vc-spacer { flex: 1; }
.vc-foot { display: flex; flex-direction: column; gap: calc(4 * var(--u)); padding-bottom: calc(2 * var(--u)); }
.vc-wr { display: flex; justify-content: space-between; padding: 0 calc(10 * var(--u)); color: rgb(0 0 0 / .7); align-items: center; }
.vc-wr b { font-size: calc(8 * var(--u)); font-weight: 900; margin-right: calc(4 * var(--u)); }
.vc-wr span { font-size: calc(8 * var(--u)); font-weight: 700; }
.vc-wr em { font-style: normal; font-size: calc(9 * var(--u)); font-weight: 700; color: #ff9500; }
.vc-cr { display: flex; justify-content: space-between; padding: 0 calc(10 * var(--u)); font-size: calc(7 * var(--u)); font-weight: 600; color: rgb(0 0 0 / .5); }

/* Ultra front */
.ult {
  height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column;
  border-radius: calc(18 * var(--u));
  background: linear-gradient(160deg, var(--t-secondary), var(--t-primary)) center / cover no-repeat;
  box-shadow: 0 calc(6 * var(--u)) calc(14 * var(--u)) rgb(255 149 0 / .8);
}
.ult::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  padding: calc(5 * var(--u));
  background: linear-gradient(135deg, #ffcc00, #ff9500, #ffcc00);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.ult .vc-head { padding: calc(12 * var(--u)) calc(14 * var(--u)) calc(6 * var(--u)); background: linear-gradient(rgb(0 0 0 / .75), rgb(0 0 0 / 0)); }
.ult .vc-stage { color: #ffcc00; text-shadow: 0 calc(1 * var(--u)) calc(2 * var(--u)) #000; }
.ult .vc-name { color: #fff; text-shadow: 0 calc(1 * var(--u)) calc(3 * var(--u)) #000; }
.ult .vc-eco { gap: calc(4 * var(--u)); }
.ult .vc-eco b { color: #ffcc00; text-shadow: 0 calc(1 * var(--u)) calc(2 * var(--u)) #000; }
.ult .vc-eco strong { color: #fff; font-size: calc(26 * var(--u)); font-weight: 900; text-shadow: 0 calc(1 * var(--u)) calc(3 * var(--u)) #000; }
.ult .vc-badge { box-shadow: 0 calc(1 * var(--u)) calc(3 * var(--u)) rgb(var(--t-primary-rgb) / .8); }
.ult-box {
  margin: 0 calc(12 * var(--u)); padding: calc(10 * var(--u)); display: flex; flex-direction: column; gap: calc(10 * var(--u));
  background: rgb(0 0 0 / .75); border-radius: calc(10 * var(--u)); border: calc(1.5 * var(--u)) solid rgb(255 204 0 / .8);
}
.ult .vc-mt b { color: #ffcc00; }
.ult .vc-mt span { color: #fff; }
.ult .vc-dmg { color: #fff; }
.ult .vc-div { background: rgb(255 204 0 / .5); }
.ult .vc-foot { background: rgb(0 0 0 / .75); margin-top: calc(12 * var(--u)); padding-top: calc(4 * var(--u)); padding-bottom: calc(8 * var(--u)); }
.ult .vc-wr { padding: 0 calc(16 * var(--u)); }
.ult .vc-wr b { color: #ffcc00; }
.ult .vc-wr span { color: #fff; }
.ult .vc-cr { color: rgb(255 255 255 / .8); padding: 0 calc(16 * var(--u)); }

/* Back */
.back {
  height: 100%; position: relative; border-radius: calc(18 * var(--u)); overflow: hidden;
  background: linear-gradient(135deg, rgb(52 199 89 / .8), rgb(52 199 89 / .5)), #34c759;
  border: calc(6 * var(--u)) solid rgb(0 0 0 / .8);
  box-shadow: 0 0 calc(10 * var(--u)) rgb(0 0 0 / .35);
  display: grid; place-items: center;
}
.back::before { content: ""; position: absolute; inset: calc(4 * var(--u)); border: calc(4 * var(--u)) solid rgb(255 255 255 / .8); border-radius: calc(15 * var(--u)); }
.back::after { content: ""; position: absolute; inset: calc(6 * var(--u)); border: calc(1.5 * var(--u)) solid rgb(0 0 0 / .3); border-radius: calc(12 * var(--u)); }
.back-logo { display: flex; flex-direction: column; align-items: center; gap: calc(8 * var(--u)); }
.back-ring { width: calc(80 * var(--u)); height: calc(80 * var(--u)); border-radius: 50%; background: rgb(255 255 255 / .2); display: grid; place-items: center; }
.back-dot { width: calc(60 * var(--u)); height: calc(60 * var(--u)); border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 calc(4 * var(--u)) rgb(0 0 0 / .33); }
.back-dot svg { width: calc(32 * var(--u)); height: calc(32 * var(--u)); fill: #34c759; }
.back-word { font-size: calc(14 * var(--u)); font-weight: 900; color: #fff; letter-spacing: calc(4 * var(--u)); }

.vc.static { cursor: inherit; touch-action: auto; }
@media (prefers-reduced-motion: reduce) {
  .vc-flip { transition-duration: .01s; }
  .vc-spin.spinning, .vc-shake { animation: none; }
}

/* ---------- Ultra hint under the card ---------- */
.hint {
  margin: 12px auto 0; display: block; min-height: 48px; padding: 6px 12px; border: 0; background: none; cursor: pointer;
  font-size: var(--fs-5); font-weight: 700; color: var(--muted); text-align: center; line-height: 1.5;
}
.hint.on { color: var(--accent-text); }

/* ---------- Details ---------- */
dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; text-align: right; font-weight: 500; }
.src { font-size: var(--fs-5); color: var(--muted); margin: 12px 0 0; line-height: 1.6; }

/* ---------- VegCard steps ---------- */
.steps { display: flex; gap: 8px; list-style: none; margin: 0 0 20px; padding: 0; counter-reset: st; }
.steps li {
  flex: 1 1 0; min-width: 0; text-align: center; padding: 8px 4px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: var(--fs-5); line-height: 1.35;
  counter-increment: st;
}
.steps li::before { content: counter(st) "\00a0"; font-family: var(--mono); font-weight: 500; }
.steps li[aria-current="step"] { background: var(--accent-tint); color: var(--accent-text); }
.steps li.done { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.backbtn {
  min-height: 48px; padding: 0 14px 0 8px; border: 0; background: none; color: var(--accent-text);
  font-weight: 700; font-size: var(--fs-4); cursor: pointer; margin: 0 0 8px -8px;
}
.privacy { margin: 14px 0 0; font-size: var(--fs-5); color: var(--muted); }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 8px 0 16px; }
.pick .chip { min-height: 56px; font-size: var(--fs-3); }
.or { margin: 8px 0; color: var(--muted); font-size: var(--fs-5); }
.name-row { display: flex; gap: 8px; }
.name-row .input { flex: 1 1 auto; min-width: 0; }
.name-row .btn { flex: 0 0 auto; }
.thumb-sm { width: 72px; height: 72px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); float: right; margin: 0 0 8px 12px; }

/* ---------- Scan / inputs / messages ---------- */
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.field { display: block; margin: 20px 0 8px; font-weight: 700; }
.input {
  width: 100%; min-height: 52px; padding: 12px 16px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: var(--fs-4);
}
.input::placeholder { color: var(--muted); opacity: 1; }

  var QA = [
    {"id": "q1", "q": {"zh": "為甚麼蔬菜有這麼多洞？", "en": "Why are there so many holes in the vegetables?"}, "a": {"zh": "因為不使用化學合成農藥，昆蟲會啃食葉片。例如黃條跳甲這類小甲蟲，會在菜心、白菜等葉菜上咬出許多細小孔洞。農夫會使用防蟲網、輪作等方法減少蟲害，但難以完全避免。", "en": "Without synthetic chemical pesticides, insects get to the leaves. Small beetles such as flea beetles chew tiny holes in leafy greens like choy sum and pak choi. Farmers reduce this with insect nets and crop rotation, but some holes remain."}, "sources": [], "photo": "holes"},
    {"id": "q2", "q": {"zh": "有機是否代表完全沒有農藥？", "en": "Does organic mean no pesticides at all?"}, "a": {"zh": "不一定。有機耕作不使用化學合成農藥，但可使用部分天然來源的防治方法，例如漁農自然護理署有機耕作資料提及的苦楝油及天然除蟲菊。研究亦指出，有機食物不一定完全沒有農藥殘餘，但驗出殘餘的機會較低。", "en": "Not exactly. Organic farming does not use synthetic chemical pesticides, but it can use some natural-source controls, such as the neem oil and natural pyrethrins listed in AFCD's organic farming guidance. Research also shows organic food is not always 100% residue-free, though residues are found less often."}, "sources": []},
    {"id": "q3", "q": {"zh": "如何確認是真正的有機產品？", "en": "How do I know it's really organic?"}, "a": {"zh": "香港沒有法例規管「有機」認證，認證屬自願性質。主要認證機構為香港有機資源中心（HKORC），其標準參考國際有機農業運動聯盟（IFOAM）。顧客可留意認證標籤或證書，或直接向農夫查詢：中環農墟部分農場已獲 HKORC 認證，部分則為自行聲稱有機。", "en": "Hong Kong has no law requiring organic certification; it is voluntary. The main certifier is the Hong Kong Organic Resource Centre (HKORC), whose standards are based on IFOAM's. Check the certification label or certificate, or ask the farmer: at the Central Farmers' Market some farms are HKORC-certified and some are self-claimed organic."}, "sources": []},
    {"id": "q4", "q": {"zh": "有蟲洞的蔬菜可以食用嗎？", "en": "Is it safe to eat leaves with holes?"}, "a": {"zh": "葉上的細小蟲洞，清洗乾淨後即可食用；被嚴重啃食的部分可以摘除。如葉片內有彎曲的「隧道」痕跡或出現腐爛，則不宜食用該片葉。", "en": "Leaves with small holes are fine to eat once washed; tear off badly chewed parts. Throw away leaves with winding tunnel trails inside them, or any rotten parts."}, "sources": []},
    {"id": "q5", "q": {"zh": "為甚麼有機蔬菜較貴？", "en": "Why does organic cost more?"}, "a": {"zh": "本地有機農業規模很小：2025 年本地認證有機農場的總產量約為 1,948 公噸。設置防蟲網、人手除草及捉蟲均需要大量時間和人力。（請農夫補充實際原因。）", "en": "Local organic farming is small-scale: certified organic farms produced about 1,948 tonnes in 2025. Insect nets, hand weeding and pest picking take a lot of time and labour. (Farmer to add the real reasons.)"}, "sources": []},
    {"id": "q6", "q": {"zh": "怎樣清洗蔬菜最好？", "en": "What's the best way to wash vegetables?"}, "a": {"zh": "在水龍頭下以清水徹底沖洗。紅蘿蔔、白蘿蔔等質地較硬的蔬菜，可用乾淨的刷子擦洗。食物安全中心不建議使用洗潔精或特別清潔劑，亦不再認為需要長時間浸泡或汆水，因為這樣會流失營養。", "en": "Rinse thoroughly under clean running water. Scrub firm vegetables like carrots and radish with a clean brush. Hong Kong's Centre for Food Safety does not recommend detergents or special produce washes, and no longer considers long soaking or blanching necessary because it loses nutrients."}, "sources": []},
    {"id": "q7", "q": {"zh": "有機蔬菜是否較有營養？", "en": "Is organic food more nutritious?"}, "a": {"zh": "不一定。史丹福大學於 2012 年發表的大型文獻回顧發現，有機與一般蔬果的維他命含量並無一致差異；但有機農產品驗出農藥殘餘的機會低約 30%。兩者的農藥水平一般均在安全標準以內。不少人選擇有機食物，是為了減少農藥殘餘、保護環境及支持本地農夫。", "en": "Not necessarily. A large 2012 Stanford review found no consistent difference in vitamin content between organic and conventional produce, but organic produce had about a 30% lower risk of pesticide residues. Levels in both were generally within safety limits. Many people choose organic for fewer residues, the environment, and to support local farmers."}, "sources": []},
    {"id": "q8", "q": {"zh": "為甚麼有些蔬菜體積較小、外形不佳？", "en": "Why are some vegetables small or odd-shaped?"}, "a": {"zh": "外表並不等於質素。超級市場通常按大小和形狀挑選貨品，許多外形不符標準的蔬菜在農場已被淘汰。聯合國糧食及農業組織的報告舉例指出，一家供應商有 25% 至 30% 的紅蘿蔔因外觀問題而被剔除。農墟讓這些蔬菜仍然有人購買。", "en": "Looks are not the same as quality. Supermarkets often grade produce by size and shape, so many odd-looking vegetables are rejected at the farm. In one example in a UN Food and Agriculture Organization report, a supplier rejected 25–30% of its carrots because of how they looked. Farmers' markets give these vegetables a buyer."}, "sources": [], "photo": "size"},
    {"id": "q9", "q": {"zh": "買回家後應如何保存？", "en": "How should I store them at home?"}, "a": {"zh": "葉菜應先抹乾水分，用廚房紙包好，放入雪櫃的蔬菜格（高濕度），並最好在一星期內食用。烹調前才清洗，毋須一買回家便清洗。番薯應存放於陰涼、乾爽及避光的地方，不宜放入膠袋。", "en": "Blot leafy greens dry, wrap them in a paper towel and keep them in the fridge's vegetable drawer (high humidity); eat them within about a week. Wash just before cooking, not as soon as you get home. Keep sweet potatoes somewhere cool, dry and dark, not in a bag."}, "sources": []},
    {"id": "q10", "q": {"zh": "有機蔬菜與「信譽農場」蔬菜有何分別？", "en": "What's the difference between organic and \"Accredited Farm\" vegetables?"}, "a": {"zh": "「信譽農場計劃」是漁農自然護理署推行的自願計劃：參與農場可使用農藥，但須按指引安全使用，漁護署亦會抽樣化驗農藥殘餘。「有機」則指不使用化學合成農藥，並由香港有機資源中心等機構認證。無論是否有機，在香港出售的食物均須符合同一套食物安全標準。", "en": "\"Accredited Farm\" is a voluntary scheme run by the Agriculture, Fisheries and Conservation Department (AFCD): farms may use pesticides but must follow guidance on safe use, and AFCD samples their vegetables for residue tests. \"Organic\" means no synthetic chemical pesticides, certified by bodies such as the HKORC. Organic or not, all food sold in Hong Kong must meet the same food safety standards."}, "sources": []}

    var q = $("in-name").value;
    if (!norm(q)) { setMsg(L("needName"), true); $("in-name").focus(); return; }
    var v = lookup(q);
    if (!v) { setMsg(L("errNotFound"), true); return; }
    makeCard(v);
  }
  $("btn-make").addEventListener("click", makeFromText);
  $("in-name").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); makeFromText(); } });
  $("back-2").addEventListener("click", function () { setMsg(""); goStep(1, true); });
  $("back-3").addEventListener("click", function () { setMsg(""); goStep(scanPhoto ? 2 : 1, true); });
  $("btn-again").addEventListener("click", function () { setMsg(""); scanPhoto = null; goStep(1, true); });

  function nutRow(label, val) { return "<dt>" + esc(label) + "</dt><dd>" + (val == null ? '<span class="tbc">' + esc(L("tbc")) + "</span>" : esc(val)) + "</dd>"; }
  function renderDetails() {
    if (!scanVeg) return;
    var v = scanVeg, n = v.nutrition || NUT_NULL, c = cardText(v);
    $("card-details").innerHTML =
      "<h3>" + esc(L("cardTextH")) + "</h3><p><strong>" + esc(c.move1) + "</strong>" + colon() + esc(c.text1) + "</p>" +
      "<p><strong>" + esc(c.move2) + "</strong>" + colon() + esc(c.text2) + "</p>" +
      "<h3>" + esc(L("nutH")) + "</h3><dl class=\"kv\">" +
      nutRow(L("nEnergy"), n.energy) + nutRow(L("nProtein"), n.protein) + nutRow(L("nFiber"), n.fiber) +
      nutRow(L("nVitC"), n.vitC) + nutRow(L("nPotassium"), n.potassium) + "</dl>" +
      '<p class="src">' + esc(L("nutSrc")) + "</p>";
  }

  var saving = false;
  $("btn-save").addEventListener("click", function () {
    if (!scanVeg || saving) return;
    saving = true;
    var btn = $("btn-save"); btn.disabled = true; btn.textContent = L("saving");
    var v = scanVeg, ultra = scanCtl.ultra;
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.all([
      fontsReady,
      scanPhoto ? loadImg(scanPhoto) : Promise.resolve(null),
      ultra && ultraSrc(v.id) ? loadImg(ultraSrc(v.id)) : Promise.resolve(null)
    ]).then(function (r) {
      var cv = drawCard(v, r[1], r[2], ultra);
      return new Promise(function (res, rej) {
        if (cv.toBlob) cv.toBlob(function (b) { b ? res(b) : rej(new Error("blob")); }, "image/png");
        else rej(new Error("blob"));
      });
    }).then(function (blob) {
      if (savedURL) URL.revokeObjectURL(savedURL);
      savedURL = URL.createObjectURL(blob);
      var img = $("saved-img"); img.src = savedURL; img.alt = L("savedAlt", { name: Lx(v.name) });
      var a = $("saved-dl"); a.href = savedURL; a.setAttribute("download", "vegcard-" + v.id + (ultra ? "-ultra" : "") + ".png");
      $("saved").hidden = false;
      img.scrollIntoView({ behavior: "smooth", block: "center" });
    }).catch(function () { setMsg(L("saveErr"), true); })
      .then(function () { saving = false; btn.disabled = false; btn.textContent = L("saveBtn"); });
  });

  /* ----- Collection: scanned cards in colour, the rest "?" (localStorage, try/catch) ----- */
  var COLL_KEY = "mk.coll";
  function loadColl() {
    try { var o = JSON.parse(store.get(COLL_KEY) || "{}"); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; }
  }
  var coll = loadColl();
  function thumbOf(photo) {
    // Small copy so the collection survives a reload without filling the storage quota.
    return loadImg(photo).then(function (img) {
      var S = 200, cv = document.createElement("canvas"); cv.width = S; cv.height = S;
      cv.getContext("2d").drawImage(img, 0, 0, S, S);
      return cv.toDataURL("image/jpeg", 0.7);
    });
  }
  function saveColl() {
    var json = JSON.stringify(coll);
    try { window.localStorage.setItem(COLL_KEY, json); return; } catch (e) {}
    // Quota full or storage blocked: keep just which cards were found.
    var ids = {}; Object.keys(coll).forEach(function (k) { ids[k] = ""; });
    store.set(COLL_KEY, JSON.stringify(ids));
  }
  function addToCollection(id, photo) {
    coll[id] = coll[id] || "";
    saveColl(); renderColl();
    if (photo) thumbOf(photo).then(function (t) { coll[id] = t; saveColl(); renderColl(); }).catch(function () {});
  }
  function renderColl() {
    var n = VEG.filter(function (v) { return coll[v.id] != null; }).length;
    $("h-coll").textContent = L("collH", { n: n });
    $("coll").innerHTML = VEG.map(function (v) {
      var got = coll[v.id] != null, nm = esc(Lx(v.name));
      if (!got) {
        return '<li><button type="button" disabled aria-label="' + nm + colon() + esc(L("collLocked")) + '"><span class="coll-q" aria-hidden="true">?</span>' +
          '<span class="lbl locked">' + nm + "</span></button></li>";
      }
      return '<li><button type="button" data-id="' + v.id + '" aria-label="' + esc(L("collOpen", { name: Lx(v.name) })) + '">' +
        '<span class="vc static" aria-hidden="true" style="' + themeStyle(v) + '"><span class="vc-face" style="display:block">' + stdFrontHTML(v, coll[v.id] || null) + "</span></span>" +
        '<span class="lbl">' + nm + "</span></button></li>";
    }).join("");
  }
  $("coll").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]"); if (!b) return;
    var id = b.getAttribute("data-id");
    showCard(VEG_BY[id], coll[id] || null);
  });

  /* ================= 2. Smart Recipe ================= */
  var RECIPE_TIMEOUT_MS = 15000;
  var rcSel = {}, rcBusy = false, rcResult = null, rcController = null;
  function renderRecipeChips() {
    $("rc-veg").innerHTML = VEG.map(function (v) {
      return '<button type="button" class="chip" data-id="' + v.id + '" aria-pressed="' + (!!rcSel[v.id]) + '">' + esc(Lx(v.name)) + "</button>";
    }).join("");
    $("rc-count").textContent = L("count", { n: $("rc-extra").value.length });
  }
  $("rc-veg").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    var id = b.getAttribute("data-id"); rcSel[id] = !rcSel[id];
    b.setAttribute("aria-pressed", String(!!rcSel[id]));
  });
  $("rc-extra").addEventListener("input", function () { $("rc-count").textContent = L("count", { n: $("rc-extra").value.length }); });
  function selectedVeg() { return VEG.filter(function (v) { return rcSel[v.id]; }).map(function (v) { return v.id; }); }

  // Best built-in RECIPES match: most selected vegetables, then fewest unselected ones.
  function offlineRecipe(ids) {
    var best = null, bestScore = -1e9;
    RECIPES.forEach(function (r) {
      var have = r.veg.filter(function (v) { return ids.indexOf(v) >= 0; }).length;
      if (!have) return;
      var score = have * 10 - (r.veg.length - have) * 3 - r.pantry.length;
      if (score > bestScore) { bestScore = score; best = r; }
    });
    if (!best) return null;
    var ingredients = best.veg.map(function (id) { return Lx(VEG_BY[id].name); })
      .concat(best.pantry.map(function (id) { return Lx(PANTRY_BY[id]); }))
      .concat([L("basics")]);
    return { title: Lx(best.name), time_min: null, ingredients: ingredients, steps: Lx(best.steps), tip: "", offline: true };
  }
  function recipeHTML(r) {
    return '<article class="recipe panel"><p><span class="badge' + (r.offline ? " off" : "") + '">' + esc(r.offline ? L("badgeOffline") : L("badgeAi")) + "</span></p>" +
      "<h3>" + esc(r.title) + "</h3>" +
      (r.time_min ? '<p class="meta">' + esc(L("aboutMin", { n: r.time_min })) + "</p>" : "") +
      "<h4>" + esc(L("ingredientsH")) + "</h4><ul>" + r.ingredients.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>" +
      "<h4>" + esc(L("stepsH")) + "</h4><ol>" + r.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>" +
      (r.tip ? "<h4>" + esc(L("tipH")) + "</h4><p>" + esc(r.tip) + "</p>" : "") +
      '<p class="allergy">' + esc(L("allergy")) + "</p></article>";
  }
  // Accept only the agreed shape; anything else counts as a failure.
  function validRecipe(j) {
    var r = j && j.recipe;
    if (!r || typeof r.title !== "string" || !r.title.trim()) return null;
    if (!Array.isArray(r.ingredients) || !Array.isArray(r.steps) || !r.steps.length || r.steps.length > 6) return null;
    if (r.ingredients.some(function (s) { return typeof s !== "string"; }) || r.steps.some(function (s) { return typeof s !== "string"; })) return null;
    var t = Number(r.time_min);
    return { title: r.title, time_min: isFinite(t) && t > 0 && t <= 30 ? Math.round(t) : null, ingredients: r.ingredients, steps: r.steps, tip: typeof r.tip === "string" ? r.tip : "" };
  }
  function setStatus(html, err) { var s = $("rc-status"); s.innerHTML = html; s.classList.toggle("err", !!err); }
  function renderRecipeOut() {
    if (!rcResult) { $("rc-out").innerHTML = ""; return; }
    $("rc-out").innerHTML = recipeHTML(rcResult);
  }
  function showFallback(ids) {
    rcResult = offlineRecipe(ids);
    setStatus(esc(L("aiFailed")) + '<button type="button" class="btn secondary" id="rc-retry">' + esc(L("tryAgain")) + "</button>", true);
    renderRecipeOut();
  }
  function askRecipe() {
    if (rcBusy) return;
    var ids = selectedVeg();
    if (!ids.length) { setStatus(esc(L("needVeg")), true); return; }
    rcBusy = true; rcResult = null; renderRecipeOut();
    var btn = $("btn-recipe"); btn.disabled = true; btn.setAttribute("aria-busy", "true");
    setStatus('<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>' + esc(L("thinking")));
    var ctl = null; try { ctl = new AbortController(); } catch (e) {}
    rcController = ctl;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, RECIPE_TIMEOUT_MS);
    var body = JSON.stringify({ vegIds: ids, extra: $("rc-extra").value.trim().slice(0, 60), lang: lang });
    var done = function () { clearTimeout(timer); rcBusy = false; btn.disabled = false; btn.removeAttribute("aria-busy"); };
    var deadline = new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, RECIPE_TIMEOUT_MS + 500); });
    Promise.race([
      fetch("api/recipe", { method: "POST", headers: { "Content-Type": "application/json" }, body: body, signal: ctl ? ctl.signal : undefined })
        .then(function (res) { return res.json().catch(function () { return null; }); }),
      deadline
    ]).then(function (j) {
      var r = validRecipe(j);
      if (!r) { showFallback(ids); return; }
      rcResult = r; setStatus(""); renderRecipeOut();
    }).catch(function () { showFallback(ids); }).then(function () {
      done();
      var out = $("rc-out"); if (out.firstChild) out.firstChild.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
  $("btn-recipe").addEventListener("click", askRecipe);
  $("rc-status").addEventListener("click", function (e) { if (e.target.id === "rc-retry") askRecipe(); });

  /* ================= 3. Q&A ================= */
  var qaOpen = {};
  function renderQA() {
    $("qa-list").innerHTML = QA.map(function (item, i) {
      var q = item.q ? Lx(item.q) : L("qTbc", { n: i + 1 });
      var a = item.a ? Lx(item.a) : [L("aTbc")];
      var paras = (Array.isArray(a) ? a : [a]).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
      var ph = "";
      if (item.photo) {
        var src = photoSrc(item.photo);
        ph = src
          ? '<figure class="photo-fig"><img src="' + src + '" alt="' + esc(q) + '" loading="lazy" decoding="async"></figure>'
          : '<div class="photo-slot" role="img" aria-label="' + esc(L("photoSoon")) + '"><strong>' + esc(L("photoSoon")) + "</strong></div>";
      }
      var links = item.sources.length
        ? item.sources.map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(Lx(s.label) || s.url) + "</a>"; }).join("、")
        : '<span class="tbc">' + esc(L("tbc")) + "</span>";
      return '<details class="qa" data-id="' + item.id + '"' + (qaOpen[item.id] ? " open" : "") + "><summary>" + esc(q) + '</summary><div class="ans">' +
        paras + ph + '<p class="sources">' + esc(L("sourceLbl")) + links + "</p></div></details>";
    }).join("");
  }
  $("qa-list").addEventListener("toggle", function (e) {
    var d = e.target; if (d && d.getAttribute) qaOpen[d.getAttribute("data-id")] = d.open;
  }, true);

  /* ================= Routing ================= */
  var ROUTES = ["card", "recipe", "qa"];
  function routeFromHash() { var h = (location.hash || "").replace(/^#\/?/, ""); return ROUTES.indexOf(h) >= 0 ? h : "card"; }
  function show(r, moveFocus) {
    scanCtl.cancelPress();
    ROUTES.forEach(function (x) { $("r-" + x).hidden = x !== r; });
    Array.prototype.forEach.call(document.querySelectorAll(".nav a"), function (a) {
      if (a.getAttribute("data-r") === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (moveFocus) { window.scrollTo(0, 0); var h = $("h-" + r); if (h) h.focus({ preventScroll: true }); }
  }
  window.addEventListener("hashchange", function () { show(routeFromHash(), true); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) scanCtl.cancelPress(); });

  function renderAll() {
    applyChrome();
    renderNameChips();
    if (scanVeg) { scanCtl.render(); renderDetails(); }
    renderColl();
    renderRecipeChips();
    renderRecipeOut();
    renderQA();
  }
  renderAll();
  goStep(1, false);
  show(routeFromHash(), false);

  // The image data block sits at the end of the document so the UI paints first on slow connections.
  document.addEventListener("DOMContentLoaded", function () {
    if (!assets()) return;
    if (scanCtl.ultra) scanCtl.render();
    renderQA();
  });
})();
</script>
